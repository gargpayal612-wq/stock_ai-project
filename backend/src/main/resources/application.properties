# =====================================================================
# SupplyStock AI - Spring Boot Application Configuration
# =====================================================================

spring.application.name=supplystock-backend
server.port=8080

# Database Configuration (MySQL 8.0+)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/supplystock_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=123456
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# JWT Configuration (256-bit secure secret key)
supplystock.jwt.secret=9a3b8e7c1f2d5a4b6e8d0c2e4f6a8b1c3d5e7f9a1b3c5d7e9f1a3b5c7d9e1f3a
supplystock.jwt.expiration-ms=86400000

# AI / Python Microservice Integration
ai.service.base-url=${AI_SERVICE_URL:http://localhost:8000/api/v1}

# Logging
logging.level.com.supplystock=INFO
logging.level.org.springframework.security=WARN
